server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Il proxy davanti (piattaforma di hosting o CDN) gestisce TLS e HSTS.
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Asset con hash nel nome: il nome cambia a ogni build, quindi si possono
    # tenere in cache a lungo senza rischiare di servire codice vecchio.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Il service worker NON va messo in cache: se il browser ne tiene una copia
    # vecchia, gli aggiornamenti dell'app non arrivano piu' agli utenti.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    # Stessa ragione per il documento HTML: e' lui a puntare ai bundle nuovi.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    # Single-page app: le rotte lato client (/app/pc, /app/advisor, ...) non
    # esistono su disco e devono restituire index.html invece di un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
