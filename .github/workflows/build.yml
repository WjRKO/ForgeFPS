name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build onedir (asInvoker manifest ESPLICITO)
        working-directory: agent-build
        run: >
          pyinstaller --onedir --name forgefps-agent --console --noupx --clean
          --manifest forgefps-agent.manifest
          --version-file version_info.txt forgefps_agent.py

      - name: SAFETY CHECK - verifica manifest embedded (fail build se sbagliato)
        shell: pwsh
        working-directory: agent-build
        run: |
          $exeBytes = [System.IO.File]::ReadAllBytes("dist/forgefps-agent/forgefps-agent.exe")
          $exeText = [System.Text.Encoding]::ASCII.GetString($exeBytes)
          if ($exeText -match "requireAdministrator") {
            Write-Host "::error::EXE CONTAINS requireAdministrator - build FAILED"
            exit 1
          }
          if ($exeText -notmatch "asInvoker") {
            Write-Host "::error::EXE does NOT contain asInvoker - build FAILED"
            exit 1
          }
          Write-Host "OK: manifest verified - asInvoker present, no requireAdministrator"

      - name: Zip forgefps-agent folder
        shell: pwsh
        working-directory: agent-build
        run: Compress-Archive -Path 'dist/forgefps-agent' -DestinationPath 'dist/forgefps-agent.zip' -Force

      - name: Compute SHA256 (ZIP)
        shell: pwsh
        working-directory: agent-build
        id: hash
        run: |
          $h = (Get-FileHash dist/forgefps-agent.zip -Algorithm SHA256).Hash.ToLower()
          echo "SHA256 = $h"
          echo "## forgefps-agent.zip" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "**SHA256:** ``$h``" >> $env:GITHUB_STEP_SUMMARY
          echo "SHA256=$h" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: agent-build/dist/forgefps-agent.zip
          generate_release_notes: true
          body: |
            **SHA256 (ZIP):** `${{ steps.hash.outputs.SHA256 }}`

            v0.7.8 — Rebuild definitivo senza UAC prompt.
            Manifest esplicito asInvoker + safety check che fa fallire la build
            se rileva requireAdministrator embedded nell'exe.
